<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>City Life - Open World</title>

    <link rel="stylesheet" href="style.css">

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>

<body>

    <div id="game"></div>

    <div id="hud">
        <div class="money">Money: $<span id="money">1000</span></div>
        <div class="health">
            Health:
            <div class="health-bar">
                <div id="healthFill"></div>
            </div>
        </div>
    </div>

    <div id="shop">
        <h2>Weapon Shop</h2>

        <button onclick="buyWeapon('Pistol', 300)">
            Pistol - $300
        </button>

        <button onclick="buyWeapon('Rifle', 700)">
            Rifle - $700
        </button>

        <button onclick="closeShop()">
            Close
        </button>
    </div>

    <script src="game.js"></script>
    <script src="player.js"></script>
    <script src="car.js"></script>
    <script src="npc.js"></script>
    <script src="shop.js"></script>

</body>
</html>
